
services:
  postgres:
    image: postgres:16
    container_name: startuplens_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: startuplens
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: startuplens_db

    ports:
      - "5433:5432"

    volumes:
      - startuplens_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U startuplens -d startuplens_db
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  startuplens_pgdata:

